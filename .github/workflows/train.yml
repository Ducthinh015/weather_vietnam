name: Train GRU Model

on:
  schedule:
    - cron: "0 */6 * * *"     # chạy mỗi 6 giờ
  workflow_dispatch:          # hiển thị nút Run workflow
  repository_dispatch:        # nhận trigger từ backend train-now
    types: [manual_train_trigger]

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      DB_NAME: agricast_ai

    steps:
      # 1. Checkout source
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Install correct Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Add PYTHONPATH
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      # 5. Test DB content: count documents
      - name: Test DB content
        run: |
          python backend/trainer/test_actions_db.py

      # 6. Test raw weather data (sample records)
      - name: Test raw DB data
        run: |
          python backend/trainer/test_actions_raw_query.py

      # 7. TRAIN MODEL
      - name: Train GRU
        run: |
          python backend/trainer/train_gru.py

      # 8. Commit + Push trained model
      - name: Commit trained model
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git checkout main
          git pull origin main

          git add backend/models/
          git commit -m "Auto-update trained GRU" || echo "No changes"
          git push origin main
