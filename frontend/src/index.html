<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css" />
  <script>
    if (location.hostname && location.hostname !== 'localhost') {
      window.API_BASE = 'http://' + location.hostname + ':5000/api';
    }
  </script>
  <script type="module" src="./js/ui.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="./index.html">AgriCast AI</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="./pages/home.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="./pages/forecast.html">Dự báo</a></li>
          <li class="nav-item"><a class="nav-link" href="./pages/analysis.html">Phân tích</a></li>
          
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4 position-relative">
    <h1>AgriCast AI</h1>
    <p>Nền tảng thông minh thời tiết cho nông nghiệp.</p>
    <img src="./assets/images.jpeg" alt="AgriCast" class="img-fluid rounded shadow" style="max-width:720px;width:100%"/>

    <div id="quickWeather" class="position-fixed top-50 translate-middle-y p-3 bg-dark text-white rounded shadow-lg" style="width:240px;height:160px; right:55px; opacity:.95">
      <h6 class="text-success mb-2">🌤 Thời tiết hôm nay</h6>
      <div id="weatherData">Đang tải...</div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const hb = (window.API_BASE || 'http://localhost:5000/api').replace('/api','/health');
    fetch(hb).then(r=>r.json()).then(d=>{
      const badge=document.createElement('div');
      badge.style="position:fixed;top:10px;right:10px;padding:6px 10px;border-radius:6px;font-weight:bold;color:#fff;z-index:9999;background:"+(d.weatherapi==='ok'?'#16a34a':'#dc2626');
      badge.textContent=d.weatherapi==='ok'?'🟢 Backend OK':'🔴 Backend Fail';
      document.body.appendChild(badge);
    }).catch(()=>{});
    (function(){
      const API = window.API_BASE || 'http://localhost:5000/api';
      const cities = ['Hanoi','Ho Chi Minh City','Da Nang','Hue','Can Tho','Hai Phong','Gia Lai','Tay Ninh','Kon Tum','Dak Lak'];
      let idx = Math.floor(Math.random()*cities.length);
      const el = document.getElementById('weatherData');
      const fmt = (n, s='')=> (n==null?'-':n + s);
      async function load(){
        try{
          const city = cities[idx % cities.length];
          const res = await fetch(`${API}/weather?city=${encodeURIComponent(city)}&t=${Date.now()}`);
          const d = await res.json();
          const name = d?.location?.name || d?.name || city;
          const c = d?.current || {}; const cond = c?.condition?.text || (d?.weather?.[0]?.description || '');
          const temp = c?.temp_c ?? d?.main?.temp; const hum = c?.humidity ?? d?.main?.humidity; const wind = c?.wind_kph ?? d?.wind?.speed;
          const ic = '🌡'; const ih = '💧'; const iw = '💨';
          el.innerHTML = `<b>${name}</b><br>${cond || '—'}<br>${ic} ${fmt(temp,'°C')} – ${ih} ${fmt(hum,'%')}<br>${iw} ${fmt(wind, (c?.wind_kph!=null?' km/h':' m/s'))}`;
        }catch{ if (el) el.textContent = 'Không lấy được dữ liệu'; }
        finally{ idx++; }
      }
      load();
      const timer = setInterval(load, 5000);
      window.addEventListener('beforeunload', ()=> clearInterval(timer));
    })();
  </script>
</body>
</html>
