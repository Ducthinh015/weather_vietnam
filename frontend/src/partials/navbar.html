<script type="module" src="/js/auth.js"></script>
<script type="module">
  (async () => {
    const authMod = await import('/js/auth.js');
    const { isLoggedIn, getCurrentUser, logout } = authMod;

    const loginItem = document.getElementById('nav-login');
    const registerItem = document.getElementById('nav-register');
    const userItem = document.getElementById('nav-user');
    const logoutItem = document.getElementById('nav-logout');
    const display = document.getElementById('username-display');
    const logoutBtn = document.getElementById('logout-btn');

    if (logoutBtn) logoutBtn.addEventListener('click', (e)=>{ e.preventDefault(); logout(); });

    if (!isLoggedIn()) {
      loginItem?.classList.remove('d-none');
      registerItem?.classList.remove('d-none');
      return;
    }

    const user = await getCurrentUser();
    if (user) {
      loginItem?.classList.add('d-none');
      registerItem?.classList.add('d-none');
      userItem?.classList.remove('d-none');
      logoutItem?.classList.remove('d-none');
      if (display) display.innerText = user.name || user.email || '';
    }
  })();
</script>
