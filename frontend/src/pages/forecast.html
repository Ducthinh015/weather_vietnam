<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI • Dự báo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css" />
  
  <script>
    if (location.hostname && location.hostname !== 'localhost') {
      window.API_BASE = 'http://'+ location.hostname + ':5000/api';
    }
  </script>
  <script type="module" src="../js/ui.js?v=3"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">AgriCast AI</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link active" href="./forecast.html">Dự báo</a></li>
          <li class="nav-item"><a class="nav-link" href="./analysis.html">Phân tích</a></li>
          
        </ul>
      </div>
    </div>
  </nav>
  <div class="container py-4">
    <h1 class="mb-3">Dự báo ngắn hạn</h1>
    <form id="forecastForm" class="row g-2 mb-3">
      <div class="col-sm-6">
        <input class="form-control" type="text" name="city" placeholder="Nhập tên tỉnh/thành (VD: Hanoi)" required />
      </div>
      <div class="col-auto">
        <button id="btnForecast" class="btn btn-primary" type="button">Dự báo 5 giờ</button>
      </div>
      <div class="col-auto">
        <button id="btnIrrigationShort" class="btn btn-outline-success" type="button" disabled>Tưới tiêu</button>
      </div>
    </form>
    <p id="error" class="text-danger"></p>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card p-3">
          <canvas id="tChart" aria-label="Biểu đồ nhiệt độ"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <canvas id="hChart" aria-label="Biểu đồ độ ẩm"></canvas>
        </div>
      </div>
    </div>
    
    <pre id="forecastResult" class="card p-3 mt-3 d-none" aria-label="Kết quả dự báo"></pre>

    <hr class="my-4"/>
    <h2 class="mb-2">Dự báo trong 3 ngày tới</h2>
    <form id="forecast3Form" class="row g-2 mb-3">
      <div class="col-sm-6">
        <input class="form-control" type="text" name="city" placeholder="Nhập tên tỉnh/thành (VD: Ho Chi Minh City)" required />
      </div>
      <div class="col-auto">
        <button class="btn btn-success" type="submit">Dự báo 3 ngày</button>
      </div>
      <div class="col-auto">
        <button id="btnIrrigation3" class="btn btn-outline-success" type="button" disabled>Tưới tiêu</button>
      </div>
    </form>
    <div class="card p-3 mb-3">
      <canvas id="arimaChart" aria-label="Biểu đồ ARIMA 3 ngày"></canvas>
    </div>
    <div id="forecast3Text" class="alert alert-info d-none"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const hb = (window.API_BASE || 'http://localhost:5000/api').replace('/api','/health');
    fetch(hb).then(r=>r.json()).then(d=>{
      const badge=document.createElement('div');
      badge.style="position:fixed;top:10px;right:10px;padding:6px 10px;border-radius:6px;font-weight:bold;color:#fff;z-index:9999;background:"+(d.weatherapi==='ok'?'#16a34a':'#dc2626');
      badge.textContent=d.weatherapi==='ok'?'🟢 Backend OK':'🔴 Backend Fail';
      document.body.appendChild(badge);
    }).catch(()=>{});
  </script>
</body>
</html>
