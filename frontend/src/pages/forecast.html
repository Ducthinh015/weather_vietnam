<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI • Dự báo</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <script type="module" src="../js/ui.js"></script>
</head>
<body>
  <nav class="nav">
    <a href="../index.html">Trang chủ</a>
    <a href="./forecast.html">Dự báo</a>
    <a href="./irrigation.html">Tưới tiêu</a>
  </nav>
  <div class="container">
    <h1>Dự báo 5 giờ tới</h1>
    <form id="forecastForm">
      <input class="input" type="text" name="city" placeholder="Nhập tên thành phố" required />
      <button class="button" type="submit">Dự báo</button>
    </form>
    <div class="card">
      <canvas id="tChart" aria-label="Biểu đồ nhiệt độ"></canvas>
    </div>
    <div class="card">
      <canvas id="hChart" aria-label="Biểu đồ độ ẩm"></canvas>
    </div>
    <pre id="forecastResult" class="card" aria-label="Kết quả dự báo"></pre>
  </div>
  <script type="module" src="../js/chart.js"></script>
</body>
</html>
