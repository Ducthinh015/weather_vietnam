<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth Success • AgriCast AI</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script defer src="/js/navbar.js"></script>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
        else document.documentElement.removeAttribute('data-theme');
      }catch(_){ }
    })();
  </script>
</head>
<body style="min-height:100vh;">
  <div id="navbar"></div>
  <div class="container text-center d-flex flex-column align-items-center justify-content-center" style="min-height:80vh;">
    <div class="spinner-border text-light" role="status"></div>
    <p class="mt-3">Đang hoàn tất đăng nhập OAuth...</p>
  </div>
  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      if(token){
        localStorage.setItem('token', token);
        location.replace('../index.html');
      } else {
        // Some providers may send token in hash fragment
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
        const token2 = hashParams.get('token');
        if(token2){
          localStorage.setItem('token', token2);
          location.replace('../index.html');
        } else {
          alert('Không nhận được token từ OAuth');
          location.replace('./login.html');
        }
      }
    })();
  </script>
</body>
</html>
