<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký • AgriCast AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css" />
  <script>
    (function(){
      try{
        const t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
        else document.documentElement.removeAttribute('data-theme');
      }catch(_){ }
    })();
  </script>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card bg-secondary-subtle text-dark">
        <div class="card-body">
          <h4 class="card-title mb-3">Đăng ký</h4>
          <form id="regForm" class="vstack gap-3">
            <input class="form-control" type="text" id="name" placeholder="Họ tên" required />
            <input class="form-control" type="email" id="email" placeholder="Email" required />
            <input class="form-control" type="password" id="password" placeholder="Mật khẩu" required />
            <button class="btn btn-primary" type="submit">Tạo tài khoản</button>
            <a href="/pages/login.html" class="nav-link">Đã có tài khoản ? - Đăng nhập  </a>
          </form>
          <hr/>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-danger d-flex align-items-center gap-2" href="http://localhost:8000/api/auth/google/login">
              <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C33.7 6.3 29.1 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10.4 0 19-8.5 19-19 0-1.1-.1-2.2-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.3 16 18.8 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C33.7 6.3 29.1 4 24 4 16.2 4 9.5 8.5 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.1 0 9.7-1.9 13.2-5.1l-6.1-5.2C29 35.6 26.6 36 24 36c-5.1 0-9.6-3.1-11.3-7.5l-6.6 5.1C9.5 39.5 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.5 5.6-6.5 7.1l6.1 5.2C37.2 37.8 40 31.9 40 24c0-1.1-.1-2.2-.4-3.5z"/>
              </svg>
              Đăng ký bằng Google
            </a>
            <a class="btn btn-outline-primary d-flex align-items-center gap-2" href="http://localhost:5000/api/auth/facebook/login">
              <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#1877F2" d="M24 4C12.95 4 4 12.95 4 24c0 9.94 7.3 18.16 16.84 19.78V28.9h-5.07v-5.12h5.07v-3.9c0-5 2.97-7.76 7.53-7.76 2.18 0 4.47.39 4.47.39v4.91h-2.52c-2.48 0-3.26 1.54-3.26 3.12v3.25h5.55l-.89 5.12h-4.66v14.88C36.7 42.16 44 33.94 44 24 44 12.95 35.05 4 24 4z"/>
              </svg>
              Đăng ký bằng Facebook
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const AUTH_BASE = (window.AUTH_BASE) || (window.API_BASE ? `${window.API_BASE}/auth` : 'https://agricast-ai-vn-838179290451.asia-southeast1.run.app/api/auth');
  // Set OAuth links dynamically
  document.addEventListener('DOMContentLoaded', ()=>{
    const g = document.querySelector('a[href*="/api/auth/google/login"]');
    const f = document.querySelector('a[href*="/api/auth/facebook/login"]');
    if(g) g.href = AUTH_BASE.replace(/\/auth$/, '') + '/auth/google/login';
    if(f) f.href = AUTH_BASE.replace(/\/auth$/, '') + '/auth/facebook/login';
  });

  const form = document.getElementById('regForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try{
      const res = await fetch(`${AUTH_BASE}/register`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if(!res.ok || data.error) throw new Error(data.error || data.message || 'Đăng ký thất bại');
      localStorage.setItem('token', data.token || data?.data?.token);
      location.href = '../index.html';
    }catch(err){ alert(err.message); }
  });
</script>
</body>
</html>
