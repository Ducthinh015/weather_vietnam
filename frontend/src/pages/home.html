<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI • Trang chủ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css" />
  <script>
    if (location.hostname && location.hostname !== 'localhost') {
      window.API_BASE = 'http://' + location.hostname + ':5000/api';
    }
  </script>
  <script type="module" src="../js/ui.js?v=3"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">AgriCast AI</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="../index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="./forecast.html">Dự báo</a></li>
          <li class="nav-item"><a class="nav-link" href="./analysis.html">Phân tích</a></li>
          
        </ul>
      </div>
    </div>
  </nav>
  <div class="container py-4">
    <h1 class="mb-3">Thời tiết hiện tại</h1>
    <form id="weatherForm" class="row g-2 mb-3">
      <div class="col-sm-6">
        <input class="form-control" type="text" name="city" placeholder="Nhập tên tỉnh/thành" required />
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">Xem</button>
      </div>
    </form>
    <p id="error" class="text-danger"></p>
    <div id="weatherSummary" class="card p-3 mb-3 d-none">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <div class="h5 mb-1" id="wsCity">—</div>
          <div class="text-muted" id="wsCoord">—</div>
        </div>
        <div class="col-md-8">
          <div class="row">
            <div class="col-6"><div>Nhiệt độ</div><div class="h4" id="wsTemp">—</div></div>
            <div class="col-6"><div>Cảm nhận</div><div class="h4" id="wsFeels">—</div></div>
            <div class="col-6 mt-2"><div>Độ ẩm</div><div class="h5" id="wsHumidity">—</div></div>
            <div class="col-6 mt-2"><div>Trạng thái</div><div class="h5" id="wsCond">—</div></div>
          </div>
        </div>
      </div>
    </div>
    
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const hb = (window.API_BASE || 'http://localhost:5000/api').replace('/api','/health');
    fetch(hb).then(r=>r.json()).then(d=>{
      const badge=document.createElement('div');
      badge.style="position:fixed;top:10px;right:10px;padding:6px 10px;border-radius:6px;font-weight:bold;color:#fff;z-index:9999;background:"+(d.weatherapi==='ok'?'#16a34a':'#dc2626');
      badge.textContent=d.weatherapi==='ok'?'🟢 Backend OK':'🔴 Backend Fail';
      document.body.appendChild(badge);
    }).catch(()=>{});
  </script>
</body>
</html>
