<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI • Trang chủ</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <script type="module" src="../js/ui.js"></script>
  <script defer src="/js/navbar.js"></script>
  <script>
    (function(){
      try{
        const t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
        else document.documentElement.removeAttribute('data-theme');
      }catch(_){ }
    })();
  </script>
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h1>Thời tiết hiện tại</h1>
    <form id="weatherForm">
      <input class="input" type="text" name="city" placeholder="Nhập tên thành phố" required />
      <button class="button" type="submit">Kiểm tra</button>
    </form>
    <p id="error" class="error"></p>
    <pre id="weatherResult" class="card"></pre>
  </div>
</body>
</html>
