<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriCast AI • Lịch sử</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    if (location.hostname && location.hostname !== 'localhost') {
      window.API_BASE = 'http://' + location.hostname + ':5000/api';
    }
  </script>
  <script type="module" src="../js/ui.js?v=3"></script>
  <script defer src="/js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h1 class="mb-3">Lịch sử dự báo theo khu vực</h1>
    <form id="historyForm" class="row g-2 mb-3">
      <div class="col-sm-6">
        <input class="form-control" type="text" name="city" placeholder="Lọc theo tỉnh/thành (tùy chọn)" />
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">Tải lịch sử</button>
      </div>
    </form>
    <p id="error" class="text-danger"></p>
        <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Thời gian</th>
            <th>Thành phố</th>
            <th>Nhiệt độ dự báo (°C)</th>
          </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </div>

    <div class="card p-3 mb-3">
      <canvas id="historyChart" aria-label="Biểu đồ lịch sử dự báo"></canvas>
    </div>


  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const hb = (window.API_BASE || 'http://localhost:5000/api').replace('/api','/health');
    fetch(hb).then(r=>r.json()).then(d=>{
      const badge=document.createElement('div');
      badge.style="position:fixed;top:10px;right:10px;padding:6px 10px;border-radius:6px;font-weight:bold;color:#fff;z-index:9999;background:"+(d.weatherapi==='ok'?'#16a34a':'#dc2626');
      badge.textContent=d.weatherapi==='ok'?'🟢 ':'🔴 Backend lỗi';
      document.body.appendChild(badge);
    }).catch(()=>{});
  </script>
</body>
</html>
