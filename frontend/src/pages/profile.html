<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ • AgriCast AI</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script type="module">
    import { getCurrentUser, logout } from "../js/auth.js";
    window.logout = logout;
    window.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if(!user){ location.replace('/pages/login.html'); return; }
      document.getElementById('name').textContent = user.name || '—';
      document.getElementById('email').textContent = user.email || '—';
    });
  </script>
  <script defer src="/js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="mb-3">Hồ sơ</h4>
            <p><strong>Tên:</strong> <span id="name">...</span></p>
            <p><strong>Email:</strong> <span id="email">...</span></p>
            <button class="btn btn-outline-danger" onclick="logout()">Đăng xuất</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
